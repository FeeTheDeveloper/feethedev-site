<svg width="1200" height="1400" viewBox="0 0 1200 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverGradient" x1="248" y1="170" x2="949" y2="871" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#585D64"/>
      <stop offset="0.16" stop-color="#A2A8B0"/>
      <stop offset="0.34" stop-color="#F7FAFF"/>
      <stop offset="0.52" stop-color="#8D949D"/>
      <stop offset="0.72" stop-color="#E3E8EF"/>
      <stop offset="1" stop-color="#454A51"/>
    </linearGradient>
    <linearGradient id="silverEdge" x1="294" y1="218" x2="901" y2="825" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBD1D9"/>
      <stop offset="0.18" stop-color="#7A8088"/>
      <stop offset="0.41" stop-color="#F4F7FC"/>
      <stop offset="0.62" stop-color="#7F858E"/>
      <stop offset="0.84" stop-color="#DCE2EA"/>
      <stop offset="1" stop-color="#6C727A"/>
    </linearGradient>
    <radialGradient id="coreFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 520) rotate(90) scale(330)">
      <stop offset="0" stop-color="#1B1D21"/>
      <stop offset="0.62" stop-color="#101215"/>
      <stop offset="1" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="coreReflection" x1="390" y1="300" x2="710" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.26" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textSilver" x1="402" y1="402" x2="794" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F9FF"/>
      <stop offset="0.24" stop-color="#9AA1AA"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#8B929A"/>
      <stop offset="1" stop-color="#F0F3F8"/>
