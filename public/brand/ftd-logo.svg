  <g filter="url(#shadowGlow)">
    <circle cx="600" cy="520" r="344" stroke="url(#silverGradient)" stroke-width="10" stroke-opacity="0.22"/>
    <circle cx="600" cy="520" r="318" stroke="#E7EDF6" stroke-width="2" stroke-opacity="0.14"/>
  </g>

  <g class="orbit-ring">
    <g filter="url(#orbitTrail)" opacity="0.46">
      <path d="M311 366C360 304 436 257 523 239" stroke="#FF2B2B" stroke-width="16" stroke-linecap="round"/>
      <path d="M838 292C906 333 954 401 970 485" stroke="#00FF88" stroke-width="16" stroke-linecap="round"/>
      <path d="M876 704C831 772 758 821 674 839" stroke="#FF2B2B" stroke-width="16" stroke-linecap="round"/>
    </g>
    <circle cx="600" cy="520" r="360" stroke="url(#silverEdge)" stroke-width="12" stroke-opacity="0.72"/>
    <path d="M323 339C384 285 464 250 553 240" stroke="url(#silverGradient)" stroke-width="24" stroke-linecap="round"/>
    <path d="M833 246C914 287 973 363 985 455" stroke="url(#silverGradient)" stroke-width="24" stroke-linecap="round"/>
    <path d="M944 622C921 719 849 799 755 836" stroke="url(#silverGradient)" stroke-width="24" stroke-linecap="round"/>
    <path d="M516 842C421 829 336 775 284 692" stroke="url(#silverGradient)" stroke-width="24" stroke-linecap="round"/>
    <circle class="accent-pulse-red" cx="311" cy="366" r="12" fill="#FF2B2B"/>
    <circle class="accent-pulse-green" cx="970" cy="485" r="12" fill="#00FF88"/>
    <circle class="accent-pulse-red" cx="876" cy="704" r="10" fill="#FF2B2B"/>
    <circle class="accent-pulse-green" cx="420" cy="833" r="10" fill="#00FF88"/>
  </g>

  <g>
    <line x1="600" y1="132" x2="600" y2="170" stroke="url(#silverGradient)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="600" y1="870" x2="600" y2="908" stroke="url(#silverGradient)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="212" y1="520" x2="250" y2="520" stroke="url(#silverGradient)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="950" y1="520" x2="988" y2="520" stroke="url(#silverGradient)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>

  <g filter="url(#shadowGlow)">
    <circle cx="600" cy="520" r="280" fill="url(#coreFill)" stroke="url(#silverGradient)" stroke-width="18"/>
    <circle cx="600" cy="520" r="244" stroke="url(#silverEdge)" stroke-width="7" stroke-opacity="0.9"/>
    <circle cx="600" cy="520" r="214" stroke="#7A818A" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <g clip-path="url(#coreClip)">
    <path d="M356 310C445 240 579 231 706 293C833 355 896 470 888 584" stroke="url(#coreReflection)" stroke-width="68" stroke-linecap="round" opacity="0.58"/>
    <path d="M404 688C492 736 622 748 760 706" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="24" stroke-linecap="round"/>
    <path d="M312 559C408 517 781 446 909 479" stroke="#00FF88" stroke-opacity="0.05" stroke-width="8" stroke-linecap="round"/>
    <path d="M345 615C500 667 751 682 868 653" stroke="#FF2B2B" stroke-opacity="0.05" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#textShadow)">
    <text x="600" y="545" text-anchor="middle" fill="url(#textSilver)" font-family="'Bahnschrift SemiBold', 'Agency FB', 'Segoe UI', sans-serif" font-size="248" font-weight="700" letter-spacing="18">FTD</text>
  </g>

  <g opacity="0.95">
    <path d="M266 420H320" stroke="url(#accentRed)" stroke-width="7" stroke-linecap="round"/>
    <path d="M880 620H934" stroke="url(#accentGreen)" stroke-width="7" stroke-linecap="round"/>
    <path d="M404 237L437 269" stroke="#FF2B2B" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    <path d="M792 770L827 805" stroke="#00FF88" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="600" y="1102" text-anchor="middle" fill="url(#wordmarkSilver)" font-family="'Bahnschrift SemiBold', 'Agency FB', 'Segoe UI', sans-serif" font-size="84" font-weight="700" letter-spacing="12">FEE THE DEVELOPER</text>
  <text x="600" y="1174" text-anchor="middle" fill="#A8B0BB" fill-opacity="0.92" font-family="'Bahnschrift', 'Segoe UI', sans-serif" font-size="28" font-weight="600" letter-spacing="10">VETERAN-OWNED SOFTWARE</text>
</svg>
