    <linearGradient id="accentRed" x1="266" y1="420" x2="320" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2B2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF2B2B"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="880" y1="620" x2="934" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowGlow" x="182" y="102" width="836" height="836" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00FF88" flood-opacity="0.09"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FF2B2B" flood-opacity="0.09"/>
    </filter>
    <filter id="orbitTrail" x="206" y="126" width="788" height="788" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="textShadow" x="300" y="284" width="600" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00FF88" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FF2B2B" flood-opacity="0.08"/>
    </filter>
    <clipPath id="coreClip">
      <circle cx="600" cy="520" r="280"/>
    </clipPath>
    <style>
      .orbit-ring {
        animation: orbitSpin 14s linear infinite;
        transform-origin: 600px 520px;
      }
      .accent-pulse-red {
        animation: redPulse 4.2s ease-in-out infinite;
      }
      .accent-pulse-green {
        animation: greenPulse 5s ease-in-out infinite;
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes redPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes greenPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.95; }
      }
    </style>
