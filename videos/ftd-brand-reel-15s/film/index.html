<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fee The Developer — brand reel</title>
<style>
  /* One display face, one UI face. Point these at the brand's real files in assets/fonts/ (capture.mjs lists them). */
  /* Manrope — the site's own face. Variable Latin subset, weights 200-800. SIL OFL 1.1. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/manrope-latin-var.woff2) format('woff2'); font-weight: 200 800; font-display: block; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/manrope-latin-var.woff2) format('woff2'); font-weight: 200 800; font-display: block; }
  :root {
    /* style guide tokens: ONE accent unless the brief says otherwise */
    /* measured: tailwind.config.ts + live-site capture. ONE accent, as a tonal ramp. */
    --bg: #05070B; --ink: #F3F6FA; --ink-2: #91A0B7; --accent: #2578FF; --card: #0B1018;
    --accent-deep: #0D2BFF; --accent-lift: #22D3EE; --line: rgba(255,255,255,0.10);
    --grid: rgba(255,255,255,0.045);
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: -0.03em;
             line-height: 0.95; white-space: nowrap; }
  /* a line is a mask: words rise through it. Padding keeps descenders; start words >= 140% below so no sliver shows. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .card { position: absolute; background: var(--card); border-radius: 28px;
          border: 1px solid var(--line);
          box-shadow: 0 2px 6px rgba(0,0,0,.35), 0 30px 80px -20px rgba(0,0,0,.6); }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
